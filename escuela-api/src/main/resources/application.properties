# --- CONFIGURACI\u00d3N PARA RAILWAY ---
spring.datasource.url=${MI_DB_URL}
spring.datasource.username=${MI_DB_USER}
spring.datasource.password=${MI_DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estrategia de nombres para que coincida con la DB
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Puerto din\u00e1mico para la nube
server.port=${PORT:8080}

