<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Comedor - E.E.T.P. 275</title>
    <link rel="stylesheet" href="comedor.css">
</head>
<body>

    <a href="index.html" class="btn-volver">← Volver al Inicio</a>

    <h1>📊 Resumen de Comedor</h1>

    <button onclick="forzarReset()" 
        style="position: absolute; top: 10px; right: 10px; background-color: #d9534f; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; z-index: 1000;">
        🔄 INICIAR NUEVO DÍA
    </button>

    <div id="panelComedor"></div>

    <div id="modalPassword" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(4px);">
        <div style="background-color: #1e1e1e; color: white; margin: 15% auto; padding: 20px; border: 1px solid #ff9800; border-radius: 8px; width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: sans-serif;">
            <h3 style="color: #ff9800; margin-top: 0; margin-bottom: 15px;">🔒 Acceso Restringido</h3>
            <p style="font-size: 14px; margin-bottom: 15px;">Ingresá la contraseña para continuar:</p>
            <input type="password" id="inputPass" style="width: 80%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #555; background-color: #2d2d2d; color: white; text-align: center; font-size: 16px; outline: none;">
            <div>
                <button onclick="confirmarPassword()" style="background-color: #ff9800; color: black; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-right: 10px;">Confirmar</button>
                <button onclick="cerrarModal()" style="background-color: #6c757d; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer;">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalLoading" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); backdrop-filter: blur(4px);">
        <div style="background-color: #1e1e1e; color: white; margin: 20% auto; padding: 20px; border: 1px solid #ff9800; border-radius: 8px; width: 280px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: sans-serif;">
            <h3 style="color: #ff9800; margin: 0 0 15px 0;">⏳ Procesando</h3>
            <p style="font-size: 14px; margin: 0;">Por favor, espere un momento...</p>
        </div>
    </div>

    <div id="modalConfirmarReset" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(4px);">
        <div style="background-color: #1e1e1e; color: white; margin: 15% auto; padding: 20px; border: 1px solid #ff9800; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: sans-serif;">
            <h3 style="color: #ff9800; margin-top: 0; margin-bottom: 15px;">⚠️ Confirmación Final</h3>
            <p style="font-size: 15px; margin-bottom: 20px; line-height: 1.4;">¿Estás segura de que querés <strong>limpiar la lista de hoy</strong>?<br>Esta acción no se puede deshacer.</p>
            <div>
                <button onclick="ejecutarResetFinal()" style="background-color: #ff9800; color: black; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-right: 15px; font-size: 14px;">Sí, Limpiar</button>
                <button onclick="cerrarModalConfirmacion()" style="background-color: #6c757d; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px;">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modalAlerta" style="display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(4px);">
        <div style="background-color: #1e1e1e; color: white; margin: 15% auto; padding: 20px; border: 1px solid #ff9800; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-family: sans-serif;">
            <h3 id="alertaTitulo" style="color: #ff9800; margin-top: 0; margin-bottom: 15px;">Título</h3>
            <p id="alertaMensaje" style="font-size: 14px; margin-bottom: 20px;"></p>
            <button onclick="cerrarModalAlerta()" style="background-color: #ff9800; color: black; border: none; padding: 10px 25px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px;">Aceptar</button>
        </div>
    </div>

    <script>
        // =============================================
        // 1. CONFIGURACIÓN DE URLS BASE (Local y Nube)
        // =============================================
        //const API_RESUMEN = 'http://localhost:8080/alumnos/comedor/resumen';
        //const API_RESET = 'http://localhost:8080/alumnos/comedor/resetear-dia'; // ◄ URL LOCAL CORREGIDA

        // CONFIGURACION PRODUCCIÓN (RAILWAY)
        //const API_RESUMEN = 'https://gestion-escolar-completa-production.up.railway.app/alumnos/comedor/resumen';
        //const API_RESET = 'https://gestion-escolar-completa-production.up.railway.app/alumnos/comedor/resetear-dia'; // ◄ URL PRODUCCIÓN CORREGIDA


        // =============================================
        // 1. CONFIGURACIÓN DE URLS BASE (Servidor Escuela)
        // =============================================
        const API_RESUMEN = 'http://192.168.0.101:8080/alumnos/comedor/resumen';
        const API_RESET = 'http://192.168.0.101:8080/alumnos/comedor/resetear-dia';




        // Variable global para retener de forma temporal la clave ingresada entre pantallas modales
        let passwordTemporal = "";

        // =============================================
        // 2. CONFIGURACIÓN DE FECHA
        // =============================================
        const opciones = { 
            timeZone: 'America/Argentina/Buenos_Aires', 
            year: 'numeric', 
            month: '2-digit', 
            day: '2-digit' 
        };
        const hoy = new Intl.DateTimeFormat('en-CA', opciones).format(new Date());

        /**
         * Función para actualizar los datos visuales del comedor
         */
        async function actualizarContadores() {
            try {
                const res = await fetch(`${API_RESUMEN}?fecha=${hoy}`);
                if (!res.ok) throw new Error("Error en la respuesta de la API");

                const datos = await res.json();
                const container = document.getElementById('panelComedor');
                container.innerHTML = '';

                const turnos = Object.entries(datos);

                if (turnos.length === 0) {
                    container.innerHTML = `<p style="color: white; text-align: center;">No hay registros para hoy (${hoy})</p>`;
                    return;
                }

                for (const [turno, cantidad] of turnos) {
                    let color = "#4CAF50"; 
                    if (cantidad > 15 && cantidad <= 30) color = "#FF9800"; 
                    if (cantidad > 30) color = "#f44336"; 

                    container.innerHTML += `
                        <div class="card-comedor">
                            <div class="reloj">⏰ Turno: ${turno} hs</div>
                            <div class="cantidad" style="color: ${color}">${cantidad}</div>
                            <div class="etiqueta">ALUMNOS ANOTADOS</div>
                        </div>
                    `;
                }
            } catch (e) {
                console.error("Error al conectar con la API de comedor:", e);
                document.getElementById('panelComedor').innerHTML = 
                    `<p style="color: white; text-align: center;">Buscando conexión con el servidor...</p>`;
            }
        }

        // Inicio automático
        actualizarContadores();
        setInterval(actualizarContadores, 30000);

        // =============================================
        // 3. CONTROL DE FLUJO DE LOS MODALES
        // =============================================
        function forzarReset() {
            document.getElementById("modalPassword").style.display = "block";
            document.getElementById("inputPass").value = "";
            document.getElementById("inputPass").focus();
            passwordTemporal = ""; 
        }

        function cerrarModal() {
            document.getElementById("modalPassword").style.display = "none";
        }

        function confirmarPassword() {
            const password = document.getElementById("inputPass").value;

            if (!password) {
                mostrarAlerta("⚠️ Atención", "Debes ingresar una contraseña.");
                return;
            }

            // Almacenamos lo que escribió el usuario para usarlo en el fetch final
            passwordTemporal = password; 

            cerrarModal(); 
            document.getElementById("modalConfirmarReset").style.display = "block";
        }

        function cerrarModalConfirmacion() {
            document.getElementById("modalConfirmarReset").style.display = "none";
        }

        function mostrarAlerta(titulo, mensaje) {
            document.getElementById("alertaTitulo").innerText = titulo;
            document.getElementById("alertaMensaje").innerText = mensaje;
            document.getElementById("modalAlerta").style.display = "block";
        }

        function cerrarModalAlerta() {
            document.getElementById("modalAlerta").style.display = "none";
        }

        function mostrarLoading(show) {
            document.getElementById("modalLoading").style.display = show ? "block" : "none";
        }

        // =============================================
        // 4. LÓGICA DE ENVÍO DIRECTO AL BACKEND
        // =============================================
        async function ejecutarResetFinal() {
            cerrarModalConfirmacion(); 
            mostrarLoading(true);      

            try {
                // Adjuntamos la contraseña como parámetro en la petición URL (?password=...)
                const urlCompleta = `${API_RESET}?password=${encodeURIComponent(passwordTemporal)}`;

                const res = await fetch(urlCompleta, {
                    method: 'PUT'
                });                     

                mostrarLoading(false); 

                if (res.ok) {
                    mostrarAlerta("✅ Éxito", "La lista de hoy ha sido reseteada correctamente.");
                    actualizarContadores(); 
                } else if (res.status === 401) {
                    mostrarAlerta("❌ Denegado", "Contraseña incorrecta en el servidor. Intentá de nuevo.");
                } else {
                    const textoError = await res.text();
                    mostrarAlerta("❌ Error", textoError || "El servidor no pudo procesar la solicitud.");
                }
            } catch (e) {
                mostrarLoading(false);
                mostrarAlerta("🌐 Error de Red", "No se pudo comunicar con el servidor de Java.");
            } finally {
                passwordTemporal = ""; // Limpieza por seguridad
            }
        }
    </script>

    <style>
        .btn-volver {
            display: inline-block; 
            padding: 8px 15px; 
            margin: 10px; 
            background-color: #6c757d; 
            color: white; 
            text-decoration: none; 
            border-radius: 4px; 
            font-family: sans-serif; 
            font-size: 14px; 
            font-weight: bold;
        }
    </style>
</body>
</html>
